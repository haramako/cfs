version: 2

builds:
  - main: ./cmd/cfs
    binary: cfs
    ldflags:
      - -s -w -X main.revision={{ .ShortCommit }}
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
archives:
  - id: default
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
release:
  # v0.2.0-rc.1 のようなプレリリース版のタグは、GitHub でもプレリリースとして公開する
  prerelease: auto
